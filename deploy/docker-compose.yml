# One-command local deployment: demo app, documentation site, metrics endpoint.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
#   demo    http://localhost:8501   point-in-time playground over the subset DB
#   docs    http://localhost:8000   documentation site (mkdocs-material)
#   metrics http://localhost:9091   Prometheus-format budget ledger metrics
services:
  demo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8501:8501"
    restart: unless-stopped

  metrics:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "scripts/metrics_exporter.py", "--port", "9091"]
    ports:
      - "9091:9091"
    volumes:
      - fintrace-data:/root/.local/share/fintrace
    restart: unless-stopped

  docs:
    image: squidfunk/mkdocs-material
    working_dir: /docs
    command: ["serve", "--dev-addr", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    volumes:
      - ..:/docs:ro

volumes:
  fintrace-data:
